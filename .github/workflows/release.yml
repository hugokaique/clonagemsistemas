name: Release

# Gera os 7 artefatos (MSI, NSIS, deb, rpm, AppImage, dmg, app universal)
# a cada tag v* ou manualmente via workflow_dispatch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # necessário para publicar o GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: "msi,nsis"
          - os: ubuntu-22.04   # glibc mais antiga = AppImage/deb mais compatíveis
            bundles: "deb,rpm,appimage"
          - os: macos-latest   # Apple Silicon; o target universal cobre Intel
            bundles: "app,dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── Linux: dependências do WebKitGTK + ferramentas de disco ──────────
      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config libssl-dev \
            util-linux partclone rpm

      # ── macOS: targets para Universal Binary (Intel + Apple Silicon) ─────
      - name: Targets Rust (macOS universal)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Dependências do frontend
        run: npm ci

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Build (macOS Universal Binary)
        if: runner.os == 'macOS'
        env:
          # Preencha os secrets no repositório para assinar + notarizar:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles ${{ matrix.bundles }}

      # Publica direto no GitHub Release (tags) — sem passar por artifact
      # storage (evita a cota de 500 MB do plano gratuito; cada job da matrix
      # anexa seus próprios arquivos ao mesmo release).
      - name: Publicar no GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true

      # Upload de artifacts apenas em execuções manuais (workflow_dispatch),
      # para inspeção sem criar release.
      - name: Upload artefatos (somente dispatch manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cloneforge-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

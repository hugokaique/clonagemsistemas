name: CI

# Verificações em todo push/PR:
# - core:  motor + helper (sem GUI) em Linux, macOS e Windows — clippy sem
#          warnings, testes unitários e E2E headless (file→file, sem root).
#          É onde vive TODO o código específico de sistema operacional.
# - app:   aplicação Tauri completa (frontend + backend) nos três SOs.
# - linux-package: gera o .deb e confere que o helper privilegiado e a
#          policy do Polkit estão dentro do pacote.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Motor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Python (script E2E)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-core-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-cargo-

      - name: Clippy (zero warnings)
        run: cargo clippy -p cloneforge-core -p cloneforge-helper --all-targets -- -D warnings

      - name: Testes unitários
        run: cargo test -p cloneforge-core -p cloneforge-helper

      # Teste funcional do motor sem hardware: clone file→file, imagem .cfimg,
      # restore, corrupção, cancelamento e recusa de alvos perigosos (o helper
      # não tem manifesto UAC, então roda não-elevado no runner).
      - name: Teste E2E headless do motor
        run: |
          cargo build -p cloneforge-helper
          python ../scripts/e2e_helper.py target/debug/cloneforge-helper

  app:
    name: App Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ci-cargo-

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config libssl-dev

      - name: Frontend (tsc + vite)
        run: |
          npm ci
          npm run build

      - name: Clippy (zero warnings, workspace inteiro)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes (workspace inteiro)
        working-directory: src-tauri
        run: cargo test --workspace

  linux-package:
    name: Pacote .deb (helper + Polkit)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-pkg-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-pkg-cargo-

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config libssl-dev

      - name: Build do .deb
        run: |
          npm ci
          npm run tauri build -- --bundles deb

      # Sem o helper em /usr/bin e a policy do Polkit, NENHUMA operação de
      # disco funciona no Linux instalado — este passo impede a regressão.
      - name: Pacote contém o helper e a policy
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          dpkg -c "$deb" | tee contents.txt
          grep -q 'usr/bin/cloneforge-helper$' contents.txt
          grep -q 'usr/share/polkit-1/actions/com.cloneforge.helper.policy$' contents.txt
          dpkg -I "$deb" | grep -i -E 'depends|recommends'

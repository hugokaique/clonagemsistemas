# Configuração do Dependabot: atualizações semanais de dependências.
# Atualizações menores e de correção são agrupadas por ecossistema,
# para que cheguem como um único pull request por ecossistema.
version: 2
updates:
  # Dependências Rust (Tauri e demais crates)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-e-patch:
        update-types:
          - "minor"
          - "patch"

  # Dependências JavaScript/TypeScript (interface React)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-e-patch:
        update-types:
          - "minor"
          - "patch"

  # Versões das ações usadas nos workflows do GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-e-patch:
        update-types:
          - "minor"
          - "patch"

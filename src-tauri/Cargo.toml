[package]
name = "cloneforge"
version = "0.1.0"
description = "Clonagem, backup e deploy de sistemas operacionais"
edition = "2021"
rust-version = "1.77.2"
default-run = "cloneforge"

# core   = motor (sem GUI; todo o código específico de SO)
# helper = binário privilegiado do Linux (pkexec), linka só o core
[workspace]
members = ["core", "helper"]

[[bin]]
name = "cloneforge"
path = "src/main.rs"
# O .exe carrega o manifesto requireAdministrator: o harness de teste do
# binário não roda sem elevação ("os error 740"). Os testes vivem nas libs.
test = false

[lib]
name = "cloneforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cloneforge-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
chrono = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
